# Ingrediënten zoals je ze bij de Aldi Süd vindt.
#   naam_de    : waar je op zoekt in de winkel
#   afdeling   : id uit winkel.yaml (bepaalt de volgorde op de lijst)
#   verpakking : gangbare verpakking; `prijs` is een indicatieve schatting in euro.
#                De eenheid is dezelfde als in de recepten, zodat de lijst kan
#                uitrekenen hoeveel verpakkingen je nodig hebt.
#   voorraad   : basisvoorraad; komt op de lijst onder "check thuis"
#   heel       : altijd hele stuks (bij schalen naar boven afgerond)

