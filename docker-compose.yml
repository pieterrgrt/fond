# Fond op de server. Starten: `docker compose up -d --build`
#
# De app luistert alleen op 127.0.0.1:8098, net als je andere apps. nginx (op de
# server zelf) stuurt het verkeer voor fond.regoort.me daarheen. Nooit op 0.0.0.0:
# dan zou de app buiten nginx om openstaan.
services:
  fond:
    build: .
    image: fond:latest
    container_name: fond
    restart: unless-stopped
    env_file: .env
    environment:
      FOND_SECURE_COOKIES: "true"
      FOND_DATA_DIR: /data
      FOND_CONTENT_DIR: /app/content
    volumes:
      - ./data:/data
      # Lessen uit je git-checkout: na `git pull` volstaat `docker compose restart`.
      - ./content:/app/content:ro
    ports:
      - "127.0.0.1:8098:8000"
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
