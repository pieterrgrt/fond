# nginx-serverblok voor Fond, voor de nginx-container achter je SNI-router.
#
# Situatie: de SNI-router op :443 stuurt het verkeer voor fond.regoort.me door naar
# 127.0.0.1:8444, waar deze nginx luistert. Deze nginx heeft het TLS-certificaat
# (het "slotje") en praat binnen Docker gewoon HTTP met de app.
#
# Plaats dit bestand bij je andere serverblokken (bv. conf.d/) en controleer:
#   docker exec <nginx-container> nginx -t && docker exec <nginx-container> nginx -s reload

server {
    # Gebruikt je SNI-router het PROXY-protocol (nginx: `proxy_protocol on;` in de
    # stream-blok), zet dan `proxy_protocol` achter listen en zie de regels onderaan.
    listen 8444 ssl;
    http2 on;
    server_name fond.regoort.me;

    # Certificaat via certbot/Let's Encrypt; pas de paden aan op hoe jouw andere
    # serverblokken het doen.
    ssl_certificate     /etc/letsencrypt/live/fond.regoort.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fond.regoort.me/privkey.pem;

    # Foto's bij reflecties mogen groot zijn (de app verkleint ze).
    client_max_body_size 16m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Geen zoekmachines.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        # `fond` is de containernaam; beide containers zitten in het netwerk `proxy`.
        # Via een variabele + resolver start nginx ook als Fond even niet draait.
        resolver 127.0.0.11 valid=30s;
        set $fond http://fond:8000;
        proxy_pass $fond;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Alleen bij PROXY-protocol: het echte IP-adres van de bezoeker overnemen.
    # set_real_ip_from 172.16.0.0/12;
    # set_real_ip_from 127.0.0.1;
    # real_ip_header proxy_protocol;
}
