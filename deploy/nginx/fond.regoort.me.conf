# nginx-serverblok voor Fond (nginx draait op de server zelf).
#
# De SNI-router op :443 stuurt het verkeer voor fond.regoort.me naar
# 127.0.0.1:8444, waar nginx luistert en het TLS-certificaat heeft. nginx stuurt het
# daarna door naar de app op 127.0.0.1:8098.
#
# De SNI-router (stream.d/) stuurt met het PROXY-protocol, vandaar `proxy_protocol`
# in de listen-regel; realip.conf haalt daar het echte IP-adres uit.
#
# Installeren:
#   cp deploy/nginx/fond.regoort.me.conf /etc/nginx/sites-available/fond
#   ln -s /etc/nginx/sites-available/fond /etc/nginx/sites-enabled/fond
#   nginx -t && systemctl reload nginx

server {
    listen 127.0.0.1:8444 ssl http2 proxy_protocol;
    server_name fond.regoort.me;

    ssl_certificate     /etc/letsencrypt/live/fond.regoort.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fond.regoort.me/privkey.pem;

    # Foto's bij reflecties mogen groot zijn (de app verkleint ze).
    client_max_body_size 16m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Geen zoekmachines.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8098;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

# http:// doorsturen naar https:// (bv. als je in Safari alleen "fond.regoort.me" typt).
server {
    listen 80;
    listen [::]:80;
    server_name fond.regoort.me;
    return 301 https://$host$request_uri;
}
